[project]
name = "sigma-migration-agent"
version = "0.2.0"
description = "Source-faithful Sigma migration and local Omni pre-push packages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.6,<3", "pyyaml>=6.0,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5,<1", "jsonschema>=4.23,<5"]

[project.scripts]
sigma-migrate = "omni_migrator.prepush.cli:main"
omnikit-migration-engine = "omni_migrator.runtime:main"

[project.entry-points."omni_migrator.extractors"]
sigma = "omni_migrator.extractors.sigma.extractor:SigmaExtractor"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_migrator"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
