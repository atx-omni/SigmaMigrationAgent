name: Sigma security and offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest, macos-latest]
    steps:
      # Immutable commits resolved from official version tags, not mutable aliases.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r packages/omnikit-migration-engine/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e packages/omnikit-migration-engine
      - run: python -m pytest packages/omnikit-migration-engine/tests tests/synthetic_preflight/tests -q --show-capture=no
      - run: python scripts/render_sigma_operator_guide.py --check
      - run: git diff --exit-code
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r packages/omnikit-migration-engine/requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e packages/omnikit-migration-engine
      - run: python scripts/security_gate.py
      - run: python scripts/check_dependency_locks.py
      # All known vulnerabilities fail the gate; no unreviewed ignore list.
      - run: python -m pip_audit --require-hashes --disable-pip -r packages/omnikit-migration-engine/requirements-dev.lock
      - run: >-
          python -m bandit -r packages/omnikit-migration-engine/src scripts
          -ll -ii -f custom --msg-template '{relpath}:{line}: {test_id} {severity} {confidence}'
