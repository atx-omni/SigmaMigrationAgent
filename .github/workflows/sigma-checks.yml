name: Sigma offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e 'packages/omnikit-migration-engine[dev]'
      - run: python -m pytest packages/omnikit-migration-engine/tests tests/synthetic_preflight/tests -q --show-capture=no
      - run: python scripts/render_sigma_operator_guide.py --check
      - run: git diff --exit-code
